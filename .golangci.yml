version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # output diagnostico CLI su io.Writer fornito dal chiamante:
        # errori di scrittura non azionabili (doctor/themes).
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
